name: build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: dotnet build src/GalCompanion.csproj -c Release

      - name: Test
        run: dotnet test tests/GalCompanion.Tests/GalCompanion.Tests.csproj -c Release

      - name: Package pext
        shell: pwsh
        run: |
          $bin = "src/bin/Release/net462"
          New-Item -ItemType Directory staging | Out-Null
          Copy-Item "$bin/GalCompanion.dll" staging/
          Copy-Item "$bin/extension.yaml" staging/
          Compress-Archive -Path staging/* -DestinationPath GalCompanion.zip
          Move-Item GalCompanion.zip GalCompanion.pext

      - uses: actions/upload-artifact@v4
        with:
          name: GalCompanion-pext
          path: GalCompanion.pext

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: GalCompanion.pext
          body_path: RELEASE_NOTES.md
